name: personal builds

# Builds a branch or SHA of this fork so the PC and the server download
# binaries instead of compiling them. Lives only on the orphan branch
# `personal-builds` (the fork's default branch): it shares no history with
# upstream, so it can never ride along in a PR.
#
#   gh workflow run personal-builds.yml -R Gratenes/zeron -f ref=<branch>
#
# No secrets: artifacts of a public repo are downloadable by anyone.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA of this fork to build.
        type: string
        required: true
      targets:
        description: windows, linux or both.
        type: choice
        options: [both, linux, windows]
        default: both

permissions:
  contents: read

jobs:
  linux-server:
    if: inputs.targets == 'linux' || inputs.targets == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: system deps (zgx-beta.yml's linux job)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: personal-linux
      - name: zeron (as installed on threadripper)
        run: cargo build --release --locked -p zeron --bin zeron
      - name: version
        run: |
          ./target/release/zeron --version
          git rev-parse HEAD
      - name: name the binary by commit
        run: |
          mkdir out
          cp target/release/zeron "out/zeron-$(git rev-parse --short=9 HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeron-linux-server
          path: out/*
          retention-days: 7
          if-no-files-found: error

  windows-pc:
    if: inputs.targets == 'windows' || inputs.targets == 'both'
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Locate Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: personal-windows
          workspaces: |
            . -> target
            apps/zgx -> target
      # The zgx app: its own workspace, no `beta` feature, as the PC builds it
      # (build-final-zgx.ps1). The ZERON_ZGX_DEFAULT_* values are baked in by
      # apps/zgx/src/baked.rs on PC branches; branches without it ignore them.
      # All public values, no secrets.
      - name: zgx app (apps/zgx)
        working-directory: apps/zgx
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          ZERON_ZGX_DEFAULT_EDGE: https://zeron-v2.embedez.com
          ZERON_ZGX_DEFAULT_WORKOS_CLIENT: client_01M270WMSY2KHVFJFZJMG7YTDF
          ZERON_ZGX_DEFAULT_ENGINE_PORT: "27654"
          ZERON_ZGX_DEFAULT_ALLOW_DEFAULT_PORT: "1"
          ZERON_ZGX_DEFAULT_ENGINE_DATA_NAME: Zeron-dev
          ZERON_ZGX_DEFAULT_ENGINE_BIN: '%LOCALAPPDATA%\Programs\Zeron\zeron-engine.exe'
          ZERON_ZGX_DEFAULT_ROUTE: main
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'zgx failed to build' }
      # The headless engine the PC runs as zeron-engine.exe
      # (build-engine-headless.ps1): public zeron-v2 defaults, no secrets.
      - name: zeron-engine
        env:
          ZERON_DEFAULT_EDGE_URL: https://zeron-v2.embedez.com
          ZERON_WORKOS_CLIENT_ID: client_01M270WMSY2KHVFJFZJMG7YTDF
          ZERON_DATA_DIR_NAME: Zeron-dev
          ZERON_NO_AUTO_UPDATE: "1"
        run: |
          cargo build --release --locked -p zeron --bin zeron-engine
          if ($LASTEXITCODE -ne 0) { throw 'the engine failed to build' }
      # zgx reads its scripts, and the official templates it installs into
      # <data dir>\templates\.live, from a `ui` folder: on Windows
      # `beta\<app version>\ui` beside the exe (bundled_ui in main.rs),
      # else the build machine's source path baked in at compile time, which
      # exists only where it was built. So ship them beside the exe, as
      # scripts/package-windows.ps1 does (tests left out).
      - name: collect (exe, engine, and the ui + plugins-builtin zgx reads beside it)
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw 'no workspace version in Cargo.toml' }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item apps/zgx/target/release/zeron-zgx.exe out/
          Copy-Item target/release/zeron-engine.exe out/
          $beta = "out/beta/$version"
          New-Item -ItemType Directory -Force $beta | Out-Null
          Copy-Item -Recurse apps/zgx/ui "$beta/ui"
          Remove-Item -Recurse -Force "$beta/ui/tests"
          Copy-Item -Recurse apps/zgx/plugins-builtin "$beta/plugins-builtin"
          (git rev-parse HEAD) | Set-Content out/COMMIT.txt
          # The exe must look for exactly this folder, and it must hold the template.
          $text = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes('out/zeron-zgx.exe'))
          if (-not $text.Contains($version)) { throw "the exe doesn't carry its app version $version" }
          foreach ($f in "$beta/ui/.luaurc", "$beta/ui/templates/zeron-v2/.base.json", "$beta/ui/app.luau", "$beta/ui/templates/zeron-v2/screens", "$beta/plugins-builtin") {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing $f" }
          }
          Get-ChildItem out -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "$($_.Count) files, $($_.Sum) bytes" }
          Get-ChildItem "$beta/ui/templates/zeron-v2" -Recurse -File | Select-Object -First 5 FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeron-windows-pc
          path: out
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
