name: Windows tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/kratos/**'
      - 'dist/windows/**'
      - 'crates/**'
      - 'scripts/test-windows-*.ps1'
      - '.github/workflows/windows.yml'

      - 'connectivity/tailcat/**'
      - 'scripts/build-tailcat.sh'
      - 'scripts/package-windows.ps1'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/kratos/**'
      - 'dist/windows/**'
      - 'crates/**'
      - 'scripts/test-windows-*.ps1'
      - '.github/workflows/windows.yml'

      - 'connectivity/tailcat/**'
      - 'scripts/build-tailcat.sh'
      - 'scripts/package-windows.ps1'
  workflow_dispatch:
    inputs:
      native_gui:
        description: 'Run native GUI/pixel probes (requires a usable desktop and Direct3D)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: connectivity/tailcat/go.sum
      - name: Tailcat adapter tests and build
        run: |
          Push-Location connectivity/tailcat
          try {
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw 'Tailcat tests failed' }
          } finally { Pop-Location }
          New-Item -ItemType Directory -Force target/tailcat | Out-Null
          Push-Location connectivity/tailcat
          try {
            go build -trimpath -o ../../target/tailcat/kratos-tailcat.exe ./cmd/kratos-tailcat
            if ($LASTEXITCODE -ne 0) { throw 'Tailcat build failed' }
          } finally { Pop-Location }
          if (-not (Test-Path target/tailcat/kratos-tailcat.exe)) { throw 'Tailcat companion missing' }
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Locate Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - name: Build application
        run: cargo build --release --locked -p kratos
      - name: Shader layout tests
        run: cargo test --release --locked -p gpui_windows --lib layout
      - name: Application and updater tests
        run: cargo test --release --locked -p kratos -p kratos-update
      - name: Engine and harness unit tests
        run: cargo test --release --locked -p kratos-engine -p kratos-harness --lib
      - name: Native harness integration tests
        run: cargo test --release --locked -p kratos-harness --features native-fixture --test codex_availability --test windows_native
      - name: Harness catalog tests
        run: cargo test --release --locked -p kratos-engine --test codex_catalog
      - name: Auth integration tests
        run: cargo test --release --locked -p kratos-engine --test auth
      - name: UI tests
        run: cargo test --release --locked -p kratos-ui --lib -- --test-threads=1
      - name: CLI startup without HOME
        run: |
          # Exercise real path resolution without touching the runner's account.
          # Port zero cannot connect to another running engine.
          $env:HOME = $null
          $env:KRATOS_DATA_DIR = $null
          $env:KRATOS_EDGE_TOKEN = $null
          $env:KRATOS_IPC_PORT = '0'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "kratos smoke O'Brien 日本語"
          $expected = Join-Path $env:LOCALAPPDATA 'Kratos'
          if (Test-Path -LiteralPath $expected) {
            throw 'Windows startup path fixture must begin absent'
          }
          $output = & ./target/release/kratos.exe status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output
          if (-not (Test-Path -LiteralPath $expected -PathType Container)) {
            throw 'Windows startup did not create LOCALAPPDATA/Kratos'
          }
          $status = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          foreach ($property in @('signedIn', 'hosting', 'connected', 'profileId', 'deviceId')) {
            if ($null -eq $status.PSObject.Properties[$property]) {
              throw "Status output is missing $property"
            }
          }
          if ($status.signedIn -ne $false -or
              $status.hosting -ne $false -or
              $status.connected -ne $false -or
              $null -ne $status.profileId -or
              $null -ne $status.deviceId) {
            throw 'An isolated Windows startup must report local-only peer status'
          }
      - name: Build rendering fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
        run: cargo build --release --locked -p kratos-ui --example windows-render-fixture --features windows-render-fixture
      - name: Upload GUI test binaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-binaries
          path: |
            target/release/kratos.exe
            target/release/examples/windows-render-fixture.exe
          if-no-files-found: error
          retention-days: 1

  native-gui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-gui-binaries
          path: target/release
      - name: App lifecycle tests
        run: ./scripts/test-windows-lifecycle.ps1
      - name: Rendering tests
        run: ./scripts/test-windows-rendering.ps1
      - name: Upload GUI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-probes
          path: |
            target/windows-render-*/capture.png
            target/windows-render-*/measurements.json
            target/windows-render-*/stdout.txt
            target/windows-render-*/stderr.txt
            target/windows-lifecycle-*/result.txt
            target/windows-lifecycle-*/run-*.txt
          if-no-files-found: warn
