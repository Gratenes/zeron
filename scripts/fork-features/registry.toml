# The fork's features: what pc-combined carries on top of upstream main.
#
# One [[feature]] per thing a merge of origin/main could silently drop or break.
# scripts/fork-features/check.py reads this; FORK_FEATURES.md is generated from
# it (check.py --md), so edit this file, never the .md.
#
#   id        short slug, also the name used in reports
#   title     what the feature is, in a line
#   owner     the Zeron chat that knows it (ask it before changing or removing it)
#   branch    the fork branch (Gratenes/zeron) that carries it on its own, if any
#   commits   its commits on pc-combined (survival of their lines is checked)
#   markers   [file, regex] pairs: the file must exist and contain a match.
#             Pick what only exists while the feature is wired in (a call site,
#             an RPC method, a setting key, the test's own name), not a type name
#             that stays when its caller goes.
#   luau      zgx test-name filters that must pass (zgx test ui <filter>)
#   rust      [package, filter] pairs: `cargo test -p <package> <filter>` must pass
#             (package "zeron-zgx" runs --bin zeron-zgx)
#   status    present (default) | lost (known gone, restoration pending: reported,
#             not failing) | superseded (upstream or a later change replaced it:
#             `why` says how; markers still checked if given)
#
# Changing a marker or a status because a merge made it fail is a decision, not
# a fix: say why in the commit message, and tell the owner chat.

[meta]
base = "origin/main"
# The zgx rev apps/zgx pins. It carries the fork's zgx commits (Windows taskbar
# badge at the DPI's size, the hidden-window focus fix, block elements and
# box drawing in zgx-terminal, the panic banner that clears itself). A merge
# that brings upstream's pin back changes this line in Cargo.toml: check.py
# fails until the new pin is shown to carry them and this is updated.
zgx_pin = "e93df9771486adf8f46b5531fec1073ed1049e12"
zgx_pin_carries = ["8107109c", "1b84ddc9", "fd3ada21", "4830bf92", "e93df977"]

